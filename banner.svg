<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1f"/>
      <stop offset="0.55" stop-color="#1c1846"/>
      <stop offset="1" stop-color="#2a1f4f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAC151"/>
      <stop offset="1" stop-color="#F7797D"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7797D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F7797D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#dots)"/>
    <circle cx="880" cy="40" r="220" fill="url(#glow2)">
      <animate attributeName="r" values="200;240;200" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="290" r="200" fill="url(#glow1)">
      <animate attributeName="r" values="180;220;180" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Left: text -->
    <text x="60" y="92" font-family="'Segoe UI', Poppins, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#c9c6e8" letter-spacing="1">Hi there, I'm</text>
    <text x="58" y="158" font-family="'Segoe UI', Poppins, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#gold)">Moiz Ansari</text>
    <text x="60" y="196" font-family="'Segoe UI', Poppins, Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.85">Software Engineer · Frontend &amp; Full-Stack Developer</text>

    <!-- Pills -->
    <g font-family="'Segoe UI', Poppins, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="60" y="218" width="82" height="30" rx="15" fill="#61DAFB" fill-opacity="0.15" stroke="#61DAFB" stroke-opacity="0.6"/>
      <text x="101" y="238" text-anchor="middle" fill="#61DAFB">React</text>
      <rect x="152" y="218" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.5"/>
      <text x="198" y="238" text-anchor="middle" fill="#ffffff">Next.js</text>
      <rect x="254" y="218" width="112" height="30" rx="15" fill="#3178C6" fill-opacity="0.2" stroke="#5a9be0" stroke-opacity="0.7"/>
      <text x="310" y="238" text-anchor="middle" fill="#8fc0f5">TypeScript</text>
      <rect x="376" y="218" width="96" height="30" rx="15" fill="#339933" fill-opacity="0.2" stroke="#5cc45c" stroke-opacity="0.7"/>
      <text x="424" y="238" text-anchor="middle" fill="#8ee08e">Node.js</text>
    </g>

    <!-- Right: code window -->
    <g transform="translate(640,48)">
      <rect width="310" height="184" rx="14" fill="#0b0a1a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="22" cy="22" r="6" fill="#FF5F57"/>
      <circle cx="42" cy="22" r="6" fill="#FEBC2E"/>
      <circle cx="62" cy="22" r="6" fill="#28C840"/>
      <text x="290" y="27" text-anchor="end" font-family="Consolas, 'Fira Code', Menlo, monospace" font-size="12" fill="#8a87a8">moiz.ts</text>
      <g font-family="Consolas, 'Fira Code', Menlo, monospace" font-size="14">
        <text x="22" y="64"><tspan fill="#C792EA">const</tspan><tspan fill="#ffffff"> moiz = {</tspan></text>
        <text x="40" y="90"><tspan fill="#82AAFF">role</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#C3E88D">"Engineer"</tspan><tspan fill="#ffffff">,</tspan></text>
        <text x="40" y="116"><tspan fill="#82AAFF">loves</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#C3E88D">"clean UI"</tspan><tspan fill="#ffffff">,</tspan></text>
        <text x="40" y="142"><tspan fill="#82AAFF">coffee</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#F78C6C">Infinity</tspan></text>
        <text x="22" y="168" fill="#ffffff">};<tspan fill="#FAC151">▍<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
      </g>
    </g>
  </g>
</svg>
