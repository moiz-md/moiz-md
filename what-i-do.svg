<svg xmlns="http://www.w3.org/2000/svg" width="1004" height="286" viewBox="-2 -2 1004 286" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1740"/>
      <stop offset="1" stop-color="#12102b"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61DAFB"/><stop offset="1" stop-color="#3178C6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ee08e"/><stop offset="1" stop-color="#339933"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAC151"/><stop offset="1" stop-color="#F7797D"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C792EA"/><stop offset="1" stop-color="#7B61FF"/></linearGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Poppins, Inter, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #ffffff; }
    .desc { font-size: 15px; fill: #b9b6d6; }
    .icon { font-family: Consolas, 'Fira Code', Menlo, monospace; font-size: 22px; font-weight: 700; fill: #0d0b1f; }
  </style>

  <!-- Card 1 -->
  <g transform="translate(0,0)">
    <rect width="490" height="132" rx="16" fill="url(#card)" stroke="#61DAFB" stroke-opacity="0.35"/>
    <rect x="28" y="30" width="56" height="56" rx="14" fill="url(#g1)"/>
    <text class="icon" x="56" y="66" text-anchor="middle">&lt;/&gt;</text>
    <text class="t title" x="106" y="56">Frontend Development</text>
    <text class="t desc" x="106" y="86">Responsive, accessible and pixel-perfect</text>
    <text class="t desc" x="106" y="108">interfaces with React and Next.js.</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(510,0)">
    <rect width="490" height="132" rx="16" fill="url(#card)" stroke="#5cc45c" stroke-opacity="0.35"/>
    <rect x="28" y="30" width="56" height="56" rx="14" fill="url(#g2)"/>
    <text class="icon" x="56" y="66" text-anchor="middle">{ }</text>
    <text class="t title" x="106" y="56">Full-Stack Development</text>
    <text class="t desc" x="106" y="86">REST APIs and backends built with</text>
    <text class="t desc" x="106" y="108">Node.js, Express and MySQL.</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(0,150)">
    <rect width="490" height="132" rx="16" fill="url(#card)" stroke="#FAC151" stroke-opacity="0.35"/>
    <rect x="28" y="30" width="56" height="56" rx="14" fill="url(#g3)"/>
    <path d="M60 42 L46 62 H56 L52 76 L68 54 H58 Z" fill="#0d0b1f"/>
    <text class="t title" x="106" y="56">Performance &amp; SEO</text>
    <text class="t desc" x="106" y="86">Fast-loading, search-friendly websites</text>
    <text class="t desc" x="106" y="108">using modern Next.js features.</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(510,150)">
    <rect width="490" height="132" rx="16" fill="url(#card)" stroke="#C792EA" stroke-opacity="0.35"/>
    <rect x="28" y="30" width="56" height="56" rx="14" fill="url(#g4)"/>
    <path d="M44 58 L52 66 L68 48" fill="none" stroke="#0d0b1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t title" x="106" y="56">Testing &amp; Clean Code</text>
    <text class="t desc" x="106" y="86">Reliable, maintainable code with</text>
    <text class="t desc" x="106" y="108">Jest, TypeScript and solid architecture.</text>
