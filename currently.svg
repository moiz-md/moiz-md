<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15132f"/>
      <stop offset="1" stop-color="#0d0b1f"/>
    </linearGradient>
  </defs>
  <style>
    .m { font-family: Consolas, 'Fira Code', Menlo, 'Courier New', monospace; font-size: 17px; }
    .p { fill: #28C840; } .c { fill: #82AAFF; } .o { fill: #e6e4f5; } .s { fill: #C3E88D; } .y { fill: #FAC151; }
    .l { animation: show 0.4s ease backwards; }
    .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 0.9s; } .l3 { animation-delay: 1.5s; }
    .l4 { animation-delay: 2.1s; } .l5 { animation-delay: 2.7s; } .l6 { animation-delay: 3.3s; }
    .l7 { animation-delay: 3.9s; } .l8 { animation-delay: 4.5s; } .l9 { animation-delay: 5.1s; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <rect width="1000" height="330" rx="16" fill="url(#term)" stroke="#ffffff" stroke-opacity="0.12"/>
  <path d="M16 0 H984 A16 16 0 0 1 1000 16 V44 H0 V16 A16 16 0 0 1 16 0 Z" fill="#1f1c45"/>
  <circle cx="26" cy="22" r="7" fill="#FF5F57"/>
  <circle cx="50" cy="22" r="7" fill="#FEBC2E"/>
  <circle cx="74" cy="22" r="7" fill="#28C840"/>
  <text x="500" y="27" text-anchor="middle" class="m" font-size="14" fill="#8a87a8">moiz@github: ~</text>

  <g class="m">
    <text x="30" y="82" class="l l1"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="o">whoami</tspan></text>
    <text x="30" y="106" class="l l2 o">Software Engineer @ Motilal Oswal · Mumbai, India</text>

    <text x="30" y="142" class="l l3"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="o">cat focus.txt</tspan></text>
    <text x="30" y="166" class="l l4 o">Building modern, fast web apps with Next.js &amp; TypeScript</text>

    <text x="30" y="202" class="l l5"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="o">ls ./learning</tspan></text>
    <text x="30" y="226" class="l l6 s">next-app-router/<tspan x="230">server-components/</tspan><tspan x="450">ai-assisted-dev/</tspan></text>

    <text x="30" y="262" class="l l7"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="o">echo $MOTTO</tspan></text>
    <text x="30" y="286" class="l l8 y">"Write code that humans enjoy reading."</text>
    <rect x="30" y="302" width="10" height="4" fill="#FAC151" class="l l9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
